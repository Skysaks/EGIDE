<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉGIDE France — Protection rapprochée à la demande</title>
<style>
:root{
  --bg:#000;--s1:#0c0c0e;--s2:#151517;--s3:#1d1d20;--s4:#2a2a2e;--s5:#3a3a3f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --t1:#f5f5f7;--t2:#a1a1a6;--t3:#6e6e73;
  --ok:#30d158;--warn:#ffd60a;--bad:#ff453a;--info:#64d2ff;--ac:#0a84ff;
  --sheet:rgba(16,16,18,.94);--glass:rgba(22,22,24,.86);--top:rgba(0,0,0,.72);
  --mbg:#0a0b0d;--mgrid:#15161a;--mroad:#202227;--mriver:#0c1726;--mpark:#0d1811;--mlabel:#3a3b41;
  --frame:#161618;--frame2:#2c2c2e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=light]{
  --bg:#f5f5f7;--s1:#ffffff;--s2:#f2f2f5;--s3:#e8e8ed;--s4:#dcdce1;--s5:#c7c7cc;
  --line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.13);
  --t1:#1d1d1f;--t2:#6e6e73;--t3:#8e8e93;
  --ok:#248a3d;--warn:#b25000;--bad:#d70015;--info:#0071e3;
  --sheet:rgba(255,255,255,.94);--glass:rgba(255,255,255,.86);--top:rgba(245,245,247,.75);
  --mbg:#e9e9ec;--mgrid:#dcdce0;--mroad:#ffffff;--mriver:#c6d9ec;--mpark:#d3e5d1;--mlabel:#9a9aa0;
  --frame:#d8d8dc;--frame2:#bdbdc2;
}
[data-contrast=high]{--t2:#d1d1d6;--t3:#a1a1a6;--line:rgba(255,255,255,.16);--line2:rgba(255,255,255,.28)}
[data-theme=light][data-contrast=high]{--t2:#3a3a3c;--t3:#55555a;--line:rgba(0,0,0,.18);--line2:rgba(0,0,0,.3)}
[data-reduce=on] *{animation:none!important;transition:none!important}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit;background:none;border:0;outline:0}
select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.ac{color:var(--ac)}

/* top */
.top{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:11px 22px;background:var(--top);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.32em;font-size:14px;white-space:nowrap}
.brand .lg{width:26px;height:26px;border-radius:8px;background:var(--t1);color:var(--bg);display:grid;place-items:center}
.brand .lg svg{stroke-width:2.2;width:16px;height:16px}
.brand small{letter-spacing:.08em;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--ac);color:#fff}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin:0 auto}
.seg button{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--t2);transition:.2s;white-space:nowrap}
.seg button.on{background:var(--s4);color:var(--t1)}
.tr{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:10px;background:var(--s2);font-size:12.5px;font-weight:600;color:var(--t2)}
.pill:hover{color:var(--t1)}
.icb{width:32px;height:32px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--t2)}
.icb:hover{color:var(--t1)}

/* stage + rail */
.stage{display:flex;justify-content:center;gap:56px;padding:32px 24px 60px;align-items:flex-start}
.rail{width:330px;padding-top:20px}
.rail h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.rail p.lead{color:var(--t2);font-size:14.5px;margin-bottom:20px}
.rail .grp{margin-bottom:22px}
.rail .grp h4,.lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-weight:600;margin-bottom:9px}
.lbl{margin:16px 0 8px}
.jump{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);margin-bottom:6px;font-size:13.5px;transition:.15s}
.jump:hover{background:var(--s2);border-color:var(--line2)}
.jump .n{width:22px;height:22px;border-radius:7px;background:var(--s3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--t2);flex:none}
.feat{display:flex;flex-wrap:wrap;gap:6px}
.feat span{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--s1);border:1px solid var(--line);color:var(--t2)}
.feat span b{color:var(--t1);font-weight:600}

/* phone */
.phone{width:390px;height:844px;border-radius:56px;background:var(--bg);position:relative;overflow:hidden;flex:none;box-shadow:0 0 0 10px var(--frame),0 0 0 11px var(--frame2),0 50px 140px rgba(0,0,0,.45)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:60}
.screen{position:absolute;inset:0;overflow:hidden}
.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-bg{fill:var(--mbg)}.m-gr{stroke:var(--mgrid)}.m-rd{stroke:var(--mroad)}.m-rv{stroke:var(--mriver)}.m-pk{fill:var(--mpark)}.m-lb{fill:var(--mlabel)}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:10}
.ui>*{pointer-events:auto}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:15px;font-weight:600;z-index:55;pointer-events:none}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar .bat{width:25px;height:12px;border:1.5px solid var(--t2);border-radius:4px;position:relative}
.sbar .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--t1);border-radius:1.5px}
.float{position:absolute;top:58px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:20;pointer-events:none}
.float>*{pointer-events:auto}
.fab{width:44px;height:44px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.fab.txt{width:auto;padding:0 14px;gap:7px;display:flex;align-items:center;font-size:13px;font-weight:600}
.sheet{margin-top:auto;background:var(--sheet);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border-top:1px solid var(--line2);border-radius:30px 30px 0 0;padding:8px 18px 34px;max-height:80%;overflow-y:auto;scrollbar-width:none;animation:up .35s cubic-bezier(.2,.9,.25,1)}
.sheet::-webkit-scrollbar,.full::-webkit-scrollbar{display:none}
.sheet.tall{max-height:88%}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--s5);margin:0 auto 14px}
.full{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:58px 18px 40px;z-index:30;scrollbar-width:none;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
h3{font-size:19px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--t2)}.dim{color:var(--t3)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.search{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 8px 0 16px;border-radius:16px;background:var(--s3);font-size:17px;font-weight:600}
.search .when{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--s1);padding:8px 12px;border-radius:12px;font-size:13px}
.short{display:flex;gap:10px;margin-top:14px}
.short button{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);min-width:0}
.short b{font-size:14px}.short span{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.favs{display:flex;gap:14px;margin-top:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.favs button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);flex:none}
.qcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qcard{padding:14px;border-radius:18px;background:linear-gradient(160deg,var(--s3),var(--s1));border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;min-height:96px}
.qcard b{font-size:14.5px}.qcard span{font-size:12px;color:var(--t2)}
.trust{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--s1)}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ib{width:40px;height:40px;border-radius:20px;background:var(--s3);display:grid;place-items:center;flex:none}
.route{flex:1;background:var(--s2);border-radius:14px;padding:9px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:5px;min-width:0}
.route div{display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route span{color:var(--t3);font-size:12px}
.dot{width:8px;height:8px;border-radius:4px;flex:none}.dot.me{background:var(--ac)}.dot.dst{background:var(--t1);border-radius:2px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.w{flex-wrap:wrap}
.chip{flex:none;padding:8px 13px;border-radius:20px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--t2);white-space:nowrap;transition:.15s}
.chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.chip.dis{opacity:.35;pointer-events:none}
.seg2{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin-top:8px}
.seg2 button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--t2);text-align:center}
.seg2 button.on{background:var(--s4);color:var(--t1)}
.seg2 button.on.red{background:rgba(255,69,58,.2);color:var(--bad)}
.tiers{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.tier{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;border:1.5px solid transparent;width:100%;transition:.15s}
.tier.on{border-color:var(--t1);background:var(--s2)}
.tier.off{opacity:.35;pointer-events:none}
.tier .ic{width:46px;height:46px;border-radius:13px;background:var(--s3);display:grid;place-items:center;flex:none}
.tier .nm{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:6px}
.tier .ds{font-size:12px;color:var(--t2);margin-top:2px}
.tier .pr{margin-left:auto;text-align:right;font-weight:650;font-size:15px;white-space:nowrap}
.tier .pr small{display:block;font-weight:500;font-size:11.5px;color:var(--t2)}
.badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--s4);color:var(--t2);text-transform:uppercase;white-space:nowrap}
.badge.w{background:rgba(255,214,10,.16);color:var(--warn)}
.badge.g{background:rgba(48,209,88,.16);color:var(--ok)}
.badge.r{background:rgba(255,69,58,.16);color:var(--bad)}
.badge.a{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.rowl{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.rowl:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:12px;padding:3px}
.step button{width:34px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:600}
.step button:hover{background:var(--s4)}
.step b{min-width:46px;text-align:center;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 16px;border-radius:16px;background:var(--t1);color:var(--bg);font-weight:650;font-size:16px;transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--s3);color:var(--t1)}
.btn.red{background:var(--bad);color:#fff}
.btn.grn{background:var(--ok);color:#000}
.btn.acb{background:var(--ac);color:#fff}
.btn.sm{min-height:42px;font-size:14px;border-radius:13px}
.btns{display:flex;gap:10px}
.pay{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:12px 2px;color:var(--t2);width:100%}
.pay .card{width:34px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--s5),var(--s3));border:1px solid var(--line2)}
.pay b{color:var(--t1)}
.banner{display:flex;gap:10px;padding:12px;border-radius:14px;font-size:12.5px;line-height:1.4;margin-top:10px}
.banner.r{background:rgba(255,69,58,.12);color:var(--bad)}
.banner.y{background:rgba(255,214,10,.12);color:var(--warn)}
.banner.b{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--t1)}
.banner.g{background:rgba(48,209,88,.11);color:var(--ok)}
.banner svg{margin-top:1px}
.agent{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.av{width:56px;height:56px;border-radius:28px;background:linear-gradient(145deg,var(--s5),var(--s3));display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;position:relative;color:var(--t1)}
.av .vf{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:10px;background:var(--ok);color:#000;display:grid;place-items:center;border:2px solid var(--s2)}
.av .vf svg{width:11px;height:11px;stroke-width:3}
.av.sm{width:40px;height:40px;font-size:14px}
.av.md{width:48px;height:48px;font-size:15px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tags span{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--s3);color:var(--t2)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--s2);font-size:11.5px;font-weight:500;color:var(--t2)}
.acts button svg{color:var(--t1)}
.eta{display:flex;align-items:baseline;gap:8px}
.eta b{font-size:34px;font-weight:700;letter-spacing:-.03em}
.code{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.25);margin-top:12px}
.code b{font-size:22px;letter-spacing:.12em;font-weight:700;color:var(--ok);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .8s linear}
.sos{position:relative;overflow:hidden;width:100%;height:58px;border-radius:18px;background:rgba(255,69,58,.14);color:var(--bad);font-weight:700;font-size:15px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.sos i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,69,58,.35)}
.sos.hold i{width:100%;transition:width 1.2s linear}
.sos span{position:relative;display:flex;gap:8px;align-items:center}
.checks{display:flex;flex-direction:column;gap:12px;margin:16px 0 6px}
.checks div{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--t3);transition:.3s}
.checks div.d{color:var(--t1)}
.checks .ck{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--s5);display:grid;place-items:center;transition:.3s;flex:none}
.checks div.d .ck{background:var(--ok);border-color:var(--ok);color:#000}
.checks .ck svg{width:13px;height:13px;stroke-width:3;opacity:0}.checks div.d .ck svg{opacity:1}
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.stars button svg{width:38px;height:38px;stroke-width:1.4;color:var(--s5)}
.stars button.on svg{fill:var(--t1);color:var(--t1)}
.list{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:0 14px;margin-top:8px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600;font-size:14.5px}.li .tx span{font-size:12.5px;color:var(--t2)}
.li .lic{width:34px;height:34px;border-radius:10px;background:var(--s3);display:grid;place-items:center;flex:none}
.tg{width:46px;height:28px;border-radius:14px;background:var(--s4);position:relative;flex:none;transition:.2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--ok)}.tg.on:after{left:21px}
.legal{font-size:11px;color:var(--t3);line-height:1.5;margin-top:14px;padding:12px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;background:var(--s3)}
.msg.me{align-self:flex-end;background:var(--ac);color:#fff}
.overlay{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;padding:70px 22px 40px;animation:fade .2s}
.overlay.red{background:radial-gradient(120% 80% at 50% 0%,#5a0f0b,#1a0504 60%,#0a0202);color:#fff}
.overlay.red .list{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.1)}.overlay.red .li .tx span{color:#ffb3ad}
.overlay.dark{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);justify-content:flex-end;padding:0}
.pulse{width:120px;height:120px;border-radius:60px;background:rgba(255,69,58,.25);display:grid;place-items:center;margin:10px auto 26px;animation:pl 1.4s infinite}
.pulse div{width:74px;height:74px;border-radius:37px;background:var(--bad);display:grid;place-items:center;color:#fff}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,69,58,.5)}100%{box-shadow:0 0 0 40px rgba(255,69,58,0)}}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:5}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:8px 6px 30px;background:var(--sheet);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--t3);padding:4px 8px}
.tabbar button.on{color:var(--ac)}
.online{width:100%;height:64px;border-radius:32px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--t1);color:var(--bg)}
.online.on{background:var(--s3);color:var(--t1)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kv div{padding:12px;border-radius:14px;background:var(--s2)}
.kv b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.kv span{font-size:11.5px;color:var(--t2)}
.cl{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;font-size:14px}
.cl .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--s5);display:grid;place-items:center;flex:none}

.cl.on span{color:var(--t3);text-decoration:line-through}
.log{font-size:12.5px;color:var(--t2);display:flex;flex-direction:column;gap:5px;margin-top:8px}
.log div{display:flex;gap:8px}.log b{color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums}
.card2{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.card2 h4{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.wk{display:grid;grid-template-columns:28px repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--t3);margin-top:8px}
.wk b{font-weight:600;text-align:center}
.wk button{height:22px;border-radius:5px;background:var(--s3)}
.wk button.on{background:var(--ac)}
input[type=range]{accent-color:var(--ac);width:100%}
.inp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px}

/* desktop dashboards */
.dash{display:flex;min-height:calc(100vh - 55px)}
.side{width:228px;flex:none;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:55px;height:calc(100vh - 55px);overflow-y:auto}
.side .sh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:12px 10px 6px}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--t2);font-weight:500}
.side button:hover{background:var(--s2);color:var(--t1)}
.side button.on{background:var(--s2);color:var(--t1)}
.side button.on svg{color:var(--ac)}
.side .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:8px;padding:1px 6px}
.dmain{flex:1;min-width:0;padding:22px 26px 60px;max-width:1500px}
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dh h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.dh .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:600;margin-bottom:4px}
.segs{display:flex;background:var(--s2);border-radius:10px;padding:3px}
.segs button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--t2)}
.segs button.on{background:var(--s4);color:var(--t1)}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.kpi{padding:15px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12px;color:var(--t2)}
.kpi b{font-size:27px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.kpi .d{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.kpi small{font-size:11.5px;font-weight:600}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px}
.ph h3{font-size:14.5px;font-weight:650}
.ph .sub{font-size:12px;color:var(--t3)}
.pb{padding:8px 16px 16px}
.chart{width:100%;display:block;overflow:visible}

.ax{fill:var(--t3);font-size:10.5px}
.gl{stroke:var(--line);stroke-width:1}

.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--s4);color:var(--t1);font-size:12px;padding:7px 10px;border-radius:9px;z-index:300;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
.hv:hover{opacity:.82}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}

.al.r .ai{background:rgba(255,69,58,.16);color:var(--bad)}

.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.sl{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.sl label{width:170px;font-size:13.5px;flex:none}
.sl b{width:60px;text-align:right;font-variant-numeric:tabular-nums}

.fil input{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;width:200px}
.mapw{position:relative;height:420px}
.mapw .lg2{position:absolute;left:14px;bottom:14px;display:flex;gap:12px;font-size:11.5px;color:var(--t2);background:var(--glass);padding:8px 12px;border-radius:10px;backdrop-filter:blur(12px)}
.mapw .lg2 i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:middle}

.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:var(--s1);border-left:1px solid var(--line2);z-index:250;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.9,.25,1);overflow-y:auto;padding:20px 20px 40px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--t1);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:400;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

function renderAll(){applyP();renderTop();$('#c-rail').innerHTML=cRail();$('#a-rail').innerHTML=aRail();cRender();cMarkers(cExtra());cRouteUpdate();aRender();aMarkers();if(S.view==='biz')renderBiz();if(S.view==='ops')renderOps();if($('#drawer').classList.contains('on'))renderDrawer();clk()}
function setView(v){S.view=v;['client','agent','biz','ops'].forEach(x=>$('#v-'+x).hidden=x!==v);renderTop();if(v==='ops')renderOps();if(v==='biz')renderBiz();window.scrollTo(0,0)}
function setCity(i){stopAnim('c');stopAnim('a');clearInterval(offerC);S.city=+i;buildCity();Object.assign(S.c,{step:'home',dest:null,agent:null,mission:null,agentArrived:false,mPos:null});Object.assign(S.a,{stage:null,pos:null});
 if(!S.c.langs.some(l=>city().langs.flat().includes(l)))S.c.langs=[city().langs[0][0]];logAudit(L('Vue ville : ','City view: ')+city().name);renderAll();toast(city().name+' · '+reg().body+' · '+curCode())}

function act(a,v,el){const c=S.c,ag=S.a,o=S.o,b=S.b;
 switch(a){
 case 'view':setView(v);break;case 'toast':toast(v);break;
 case 'settings':{const d=$('#drawer'),on=!d.classList.contains('on');if(on)renderDrawer();d.classList.toggle('on',on);$('#scrim').classList.toggle('on',on);break}
 case 'pset':{let [k,val]=v.split('|');if(k==='h12')val=val==='1';P[k]=val;saveP();if(k==='lang')buildCity();renderAll();break}
 case 'pref':P[v]=!P[v];saveP();renderAll();break;
 case 'lang':P.lang=P.lang==='en'?'fr':'en';saveP();buildCity();renderAll();break;
 case 'reset':P={...DEFP};saveP();buildCity();renderAll();toast(L('Personnalisation réinitialisée','Personalisation reset'));break;
 case 'city':setCity(v);break;
 /* client */
 case 'c:go':cGo(v);break;case 'c:back':cGo(cPrev);break;case 'c:back2':cGo(cPrev2==='prefs'?'tiers':cPrev2);break;
 case 'c:dest':c.dest=PLACES.find(p=>p.id===v);c.hours=Math.max(c.hours,T(c.tier).min||2);if(c.dest.air)c.tier='mobilite';cGo('tiers');break;
 case 'c:quick':c.ctx=v;c.dest=v==='soir'?PLACES[0]:v==='pro'?PLACES[3]:v==='event'?PLACES[7]:PLACES[5];c.tier=v==='event'?'event':v==='voyage'?'mobilite':'escorte';c.hours=2;if(v==='pro')c.dress='Costume';cGo('tiers');break;
 case 'c:fav':{const fa=AGENTS.find(x=>x.id===v);c.dest=c.dest||PLACES[2];c.tier='escorte';c.hours=2;toast(L('Demande envoyée en priorité à ','Request sent first to ')+fa.name);book(fa);break}
 case 'c:favtg':c.favs=c.favs.includes(v)?c.favs.filter(x=>x!==v):[...c.favs,v];cRender();break;
 case 'c:when':c.when=v;cRender();break;case 'c:day':c.day=+v;cRender();break;case 'c:time':c.time=v;cRender();break;case 'c:rec':c.rec=v;cRender();break;
 case 'c:ctx':c.ctx=v;cRender();break;
 case 'c:threat':c.threat=+v;if(c.threat===2&&!['detail','renforce'].includes(c.tier))c.tier='detail';cRender();break;
 case 'c:tier':{c.tier=v;const t=T(v);if(t.min)c.hours=Math.max(c.hours,t.min);cRender();break}
 case 'c:h':{const t=T(c.tier);c.hours=Math.min(12,Math.max(t.min||1,c.hours+ +v));cRender();break}
 case 'c:prot':c.prot=Math.min(6,Math.max(1,c.prot+ +v));cRender();break;
 case 'c:female':c.female=!c.female;cRender();break;case 'c:favonly':c.favOnly=!c.favOnly;cRender();break;
 case 'c:lang':c.langs=c.langs.includes(v)?(c.langs.length>1?c.langs.filter(x=>x!==v):c.langs):[...c.langs,v];cRender();break;
 case 'c:dress':c.dress=v;cRender();break;case 'c:disc':c.disc=+v;cRender();break;case 'c:veh':c.veh=v;cRender();break;
 case 'c:proto':c.proto[v]=!c.proto[v];cRender();break;
 case 'c:pay':c.payAcct=c.payAcct==='perso'?'biz':'perso';cRender();toast(c.payAcct==='biz'?L('Facturé à Hélios Conseil','Billed to Hélios Conseil'):L('Paiement personnel','Personal payment'));break;
 case 'c:book':{const q=quote(c.tier,c.hours,c.prot);if(c.payAcct==='biz'&&q.ttc>b.policy.thresh){b.appr.unshift({id:Date.now(),who:'Camille L.',tier:c.tier,h:c.hours,city:city().name,why:L('Au-delà du seuil d’approbation','Above approval threshold'),eur:q.ttc});toast(L('Envoyée pour approbation (seuil entreprise)','Sent for approval (company threshold)'));cGo('home');break}book();break}
 case 'c:eval':c.evalKind=v;logAudit(v==='menace'?L('Demande d’évaluation — menace identifiée','Assessment request — identified threat'):v==='event'?L('Demande de devis événement','Event quote request'):L('Dossier protection renforcée','Enhanced protection file'));cGo('eval');break;
 case 'c:cancel':stopAnim('c');if(c.mission){c.mission.st=L('Annulée','Cancelled');c.mission.lvl='r'}logAudit(L('Annulation client','Client cancellation'));cGo('home');break;
 case 'c:share':toast(L('Lien de suivi envoyé à vos contacts de confiance','Tracking link sent to trusted contacts'));break;
 case 'c:mismatch':stopAnim('c');if(c.mission){c.mission.st=L('Réassignation','Reassigning');c.mission.lvl='r'}o.alerts.unshift({id:Date.now(),t:L('Code de rencontre non conforme','Meeting code mismatch'),d:'Camille L. · '+city().name,lvl:'r',ack:false,t0:Date.now()});logAudit(L('ALERTE : code non conforme','ALERT: code mismatch'));cGo('mismatch');break;
 case 'c:start':startMission();break;
 case 'c:extend':c.hours=Math.min(12,c.hours+.5);toast(L('Prolongée de 30 min','Extended by 30 min'));cRender();break;
 case 'c:addagent':toast(L('Renfort demandé — estimé dans 11 min','Back-up requested — ETA 11 min'));logAudit(L('Demande de renfort','Back-up request'));break;
 case 'c:stop':toast(L('Arrêt ajouté : ','Stop added: ')+PLACES.find(p=>p.id===v).label);cGo('mission');break;
 case 'c:sosoff':o.alerts.forEach(x=>{if(!x.ack&&x.t.includes('Camille'))x.ack=true});logAudit(L('SOS annulé (fausse alerte)','SOS cancelled (false alarm)'));if(c.agent&&c.mPos){c.mRoute=manhattan(c.mPos,c.dest);cGo('mission');animate('c',16000,t=>{c.mPos=along(c.mRoute,t);cMarkers(cExtra())})}else cGo('home');break;
 case 'c:end':stopAnim('c');if(c.mission){c.mission.st=L('Terminée','Completed');c.mission.lvl='g'}logAudit(L('Fin de mission ','Mission ended ')+(c.mission?c.mission.id:''));c.rating=0;c.tags=[];c.tip=0;cGo('end');break;
 case 'c:rate':c.rating=+v;cRender();break;case 'c:tag':c.tags=c.tags.includes(v)?c.tags.filter(x=>x!==v):[...c.tags,v];cRender();break;case 'c:tip':c.tip=+v;cRender();break;
 case 'c:tg':c[v]=!c[v];cRender();break;
 case 'c:msg':c.msgs.push({me:true,t:v});cRender();setTimeout(()=>{if(S.c.step==='chat'){c.msgs.push({me:false,t:L('Bien reçu.','Got it.')});cRender()}},1200);break;
 case 'c:msgi':{const i=$('#msgi');if(i&&i.value)act('c:msg',i.value);break}
 case 'demo':demo(v);break;case 'ademo':ademo(v);break;
 /* agent */
 case 'a:tab':ag.tab=v;aRender();break;case 'a:online':aOnline();break;
 case 'a:accept':clearInterval(offerC);ag.stage='brief';logAudit('M-2620 '+L('acceptée','accepted'));aRender();break;
 case 'a:decline':clearInterval(offerC);ag.stage=null;aRoute(null);aRender();aMarkers();toast(L('Refusée — aucun impact','Declined — no impact'));break;
 case 'a:stage':ag.stage=v||null;if(!v){aRoute(null);stopAnim('a')}aRender();aMarkers();break;
 case 'a:brief':ag._ret=ag.stage;ag.stage='brief';aRender();break;
 case 'a:go':if(ag._ret==='enroute'||ag._ret==='arrived'){ag.stage=ag._ret;ag._ret=null;aRender();break}aGo();break;
 case 'a:arrive':{stopAnim('a');const f=AOFF().from;ag.pos={x:f.x+10,y:f.y+8};aRoute(null);ag.stage='arrived';aRender();aMarkers();break}
 case 'a:start':aStart();break;case 'a:ck':ag.checks[+v]=!ag.checks[+v];aRender();break;
 case 'a:log':ag.log.unshift({h:hhmm(NOW()),t:v});logAudit('M-2620 : '+v);aRender();break;
 case 'a:end':{stopAnim('a');ag.stage='rate';ag.ratingC=0;const mm=o.missions.find(x=>x.id==='M-2620');if(mm)mm.st=L('Terminée','Completed');logAudit('M-2620 '+L('terminée','completed'));aRender();break}
 case 'a:rate':ag.ratingC=+v;aRender();break;
 case 'a:done':{const p=payFor(AOFF());ag.earnToday+=p;ag.stage=null;ag.pos=null;aRoute(null);aRender();aMarkers();toast('+ '+money(p,1));break}
 case 'a:zone':ag.zones=ag.zones.includes(+v)?ag.zones.filter(x=>x!==+v):[...ag.zones,+v];aRender();break;
 case 'a:av':{const cur=ag.avail[v]!==undefined?ag.avail[v]:(+v.split('-')[1]>=3||(+v.split('-')[0]<5&&+v.split('-')[1]===1));ag.avail[v]=!cur;aRender();break}
 case 'a:ft':ag.filt.tiers=ag.filt.tiers.includes(v)?ag.filt.tiers.filter(x=>x!==v):[...ag.filt.tiers,v];aRender();break;
 case 'a:fn':ag.filt[v]=!ag.filt[v];aRender();break;
 case 'a:goal':ag.goal=Math.max(400,ag.goal+ +v);aRender();break;
 /* entreprise */
 case 'b:tab':b.tab=v;renderBiz();window.scrollTo(0,0);break;case 'b:per':b.period=v;renderBiz();break;
 case 'b:pol':b.policy[v]=!b.policy[v];renderBiz();break;
 case 'b:appr':{const [id,r]=v.split('|');const x=b.appr.find(z=>z.id==id);x.done=r;logAudit(`${L('Approbation entreprise','Business approval')} — ${x.who} : ${r==='ok'?L('approuvée','approved'):L('refusée','declined')}`);renderBiz();break}
 case 'b:csv':{const rows=[['invoice','period','amount_'+curCode(),'jobs'],...Array.from({length:6},(_,i)=>{const mi=(NOW().getMonth()-i+12)%12;return['HC-2026-'+pad(mi+1),MONTHS()[mi],Math.round(BSPEND[11-i]*FX[curCode()]),Math.round(BSPEND[11-i]/690)]})].map(r=>r.join(';')).join('\n');
  try{navigator.clipboard&&navigator.clipboard.writeText(rows).catch(()=>{})}catch(e){}
  const blobSave=()=>{try{const u=URL.createObjectURL(new Blob([rows],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='egide-factures.csv';document.body.appendChild(l);l.click();l.remove()}catch(e){}toast(L('CSV exporté (et copié dans le presse-papiers)','CSV exported (and copied to clipboard)'))};
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(!d)return blobSave();d.save({filename:'egide-factures.csv',data:rows}).then(()=>toast(L('CSV enregistré','CSV saved'))).catch(()=>toast(L('Téléchargement annulé — CSV copié','Download cancelled — CSV copied')))}).catch(blobSave)}else blobSave();break}
 /* ops */
 case 'o:tab':o.tab=v;renderOps();window.scrollTo(0,0);break;case 'o:per':o.period=v;renderOps();break;case 'o:mf':o.mf=v;renderOps();break;
 case 'o:ack':{const x=o.alerts.find(z=>z.id==v);if(x){x.ack=true;x.rt=Math.max(4,Math.round((Date.now()-(x.t0||Date.now()))/1000));logAudit(L('Alerte prise en charge : ','Alert handled: ')+x.t)}renderOps();break}
 case 'o:comp':{const [id,r]=v.split('|');const x=o.comp.find(z=>z.id==id);x.done=r;logAudit(`${L('Conformité','Compliance')} ${x.who} — ${x.doc} : ${r==='ok'?L('validé','approved'):L('suspendu','suspended')}`);renderOps();break}
 case 'o:kyc':{const [id,r]=v.split('|');const x=o.kyc.find(z=>z.id==id);x.done=r;logAudit(`Client ${x.who} : ${r==='ok'?L('accepté','accepted'):L('refusé (motivé)','refused (reasoned)')}`);renderOps();break}
 }}
window.act=act;
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();e.stopPropagation();act(el.dataset.a,el.dataset.v,el)});

function resetClient(){stopAnim('c');Object.assign(S.c,{step:'home',dest:null,threat:0,tier:'escorte',hours:2,when:'now',agent:null,mission:null,mRoute:null,mPos:null,agentArrived:false,prot:1})}
function demo(v){setView('client');resetClient();
 if(v==='book'){cGo('home');setTimeout(()=>act('c:dest','hotel'),500);setTimeout(()=>book(),1500)}
 if(v==='custom'){S.c.dest=PLACES[3];S.c.prot=3;S.c.langs=[city().langs[0][0],'EN'];S.c.female=true;S.c.disc=2;S.c.proto.recon=true;cGo('tiers');setTimeout(()=>cGo('prefs'),700)}
 if(v==='threat'){S.c.dest=PLACES[0];S.c.ctx='harc';S.c.threat=2;S.c.tier='detail';S.c.hours=4;cGo('tiers')}
 if(v==='mismatch'){S.c.dest=PLACES[2];book();setTimeout(()=>{stopAnim('c');S.c.agentPos={x:ME.x+12,y:ME.y+8};S.c.agentArrived=true;cGo('arrived')},3200)}
 if(v==='sos'){S.c.dest=PLACES[3];S.c.agent=AGENTS[3];S.c.mission={id:nextId(),client:'Camille L.',tier:tName('escorte'),agent:AGENTS[3].name+' '+AGENTS[3].last,zone:city().name,st:L('En cours','Live'),lvl:'g',x:480,y:300};S.o.missions.unshift(S.c.mission);startMission();setTimeout(()=>toast(L('Maintenez le bouton SOS 1,2 s','Hold the SOS button for 1.2 s')),400)}
 if(v==='end'){S.c.dest=PLACES[1];S.c.agent=AGENTS[1];S.c.rating=5;S.c.tags=['Discrétion','Ponctualité'];S.c.tip=10;cGo('end')}
 if(v==='activity')cGo('activity')}
function ademo(v){setView('agent');const a=S.a;stopAnim('a');clearInterval(offerC);clearTimeout(offerT);a.stage=null;a.pos=null;aRoute(null);
 if(v==='online'){a.online=false;a.tab='home';aOnline()}
 if(v==='brief'){a.online=true;a.stage='brief';aRender();aMarkers()}
 if(v==='mission'){a.online=true;a.pos={x:AOFF().from.x,y:AOFF().from.y};aStart()}
 if(v==='plan'){a.tab='plan';aRender();aMarkers()}
 if(v==='earn'){a.tab='earn';aRender();aMarkers()}
 if(v==='docs'){a.tab='profile';aRender();aMarkers()}}
function clk(){const d=NOW();document.querySelectorAll('.clk').forEach(e=>e.textContent=hhmm(d))}
setInterval(()=>{clk();const c=S.c;if(c.step==='mission'){c.elapsed+=1;const e=$('#mtime');if(e){e.textContent=fmtMin(c.elapsed)+' '+L('écoulées sur','elapsed of')+' '+c.hours+' h';e.previousElementSibling.firstElementChild.style.width=Math.min(100,c.elapsed/(c.hours*60)*100)+'%'}}
 const a=S.a;if(a.stage==='mission'){a.elapsed+=1;const e=$('#amtime');if(e){e.textContent=fmtMin(a.elapsed)+' / '+AOFF().h+' h';e.previousElementSibling.firstElementChild.style.width=Math.min(100,a.elapsed/(AOFF().h*60)*100)+'%'}}
 if(S.view==='ops'&&o_live())renderOps()},1000);
function o_live(){return S.o.tab==='live'&&(++S.tick%4===0)}
matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(P.theme==='auto')applyP()});

/* boot */
applyP();buildCity();seedOps();
S.b.appr=[{id:1,who:'Sana Benali',tier:'detail',h:6,city:CFG.cities[Math.min(2,CFG.cities.length-1)].name,why:L('Au-delà du seuil d’approbation','Above approval threshold'),eur:3240},{id:2,who:'Paul Martin',tier:'prive',h:4,city:CFG.cities[0].name,why:L('Gamme au-dessus du niveau du collaborateur','Tier above employee level'),eur:820},{id:3,who:'Hugo Lenoir',tier:'mobilite',h:3,city:CFG.cities[1].name,why:L('Mission de nuit','Night job'),eur:960}];
renderAll();
</script>
